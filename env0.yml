version: 2

deploy:
  steps:
    terraformInit:
      before:
        - name: Build MultiTool from Source
          run: |
            which npm
            
            # Install build dependencies
            sudo apk add --no-cache build-base gcc musl-dev git pkgconf openssl-dev openssl-libs-static
            
            # Install Rust toolchain (non-interactive)
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source $HOME/.cargo/env
            
            # Verify compiler is available
            which gcc
            gcc --version
            
            # Clone MultiTool source code
            git clone https://github.com/wack/multitool.git multitool
            
            # Install cargo-make
            cargo install --force cargo-make
            
            # Build MultiTool
            cd multitool
            cargo make build
